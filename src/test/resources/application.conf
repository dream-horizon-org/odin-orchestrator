dsl = {
  url = "https://raw.githubusercontent.com/dream-sports-labs/odin-components/chore/index.yaml"
  username = ${?ODIN_DSL_USERNAME}
  password = ${?ODIN_DSL_PASSWORD}
  state = {
    config = {
      bucket = "odin-state"
    }
  }

  lock = {
    config = {
      host = "localhost"
    }
  }
}

componentRegistry = {
  url = "https://raw.githubusercontent.com/dream-sports-labs/odin-components/chore/index.yaml"
  username = ${?ODIN_COMPONENT_REGISTRY_USERNAME}
  password = ${?ODIN_COMPONENT_REGISTRY_PASSWORD}
}

runner = {
  image = "docker.io/dream-sports-labs/odin-runner:0.0.1"
  imagePullPolicy = "IfNotPresent"
  dind = {
    enabled = false
  }
  env = {
    AWS_ACCESS_KEY_ID = "accesskey"
    AWS_SECRET_ACCESS_KEY = "secretkey"
  }
}

discovery = {
  url = "http://localhost:8081"
}
