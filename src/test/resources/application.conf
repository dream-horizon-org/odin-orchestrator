dsl = {
  url = "https://raw.githubusercontent.com/ds-horizon/odin-components/chore/index.yaml"
  username = ${?ODIN_DSL_USERNAME}
  password = ${?ODIN_DSL_PASSWORD}
  state = {
    config = {
      bucket = "odin-state"
    }
  }

  lock = {
    config = {
      host = "localhost"
    }
  }
}

componentRegistry = {
  url = "https://raw.githubusercontent.com/ds-horizon/odin-components/chore/index.yaml"
  username = ${?ODIN_COMPONENT_REGISTRY_USERNAME}
  password = ${?ODIN_COMPONENT_REGISTRY_PASSWORD}
}

runner = {
  image = "docker.io/ds-horizon/odin-runner:0.0.1"
  imagePullPolicy = "IfNotPresent"
  env = {
    AWS_ACCESS_KEY_ID = "accesskey"
    AWS_SECRET_ACCESS_KEY = "secretkey"
  }
  hostVolumeMounts = [
    {
      name = "test-host"
      hostPath = "/tmp"
      mountPath = "/host/tmp"
    }
  ]
  dockerSecrets = [
    {
      name = "test"
      server = "test-registry.io"
      username = "test"
      password = "test"
    }
  ]
}

discovery = {
  url = "http://localhost:8081"
}
