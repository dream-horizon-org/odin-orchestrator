dsl = {
  state = {
    config = {
      bucket = "odin-state"
    }
  }

  lock = {
    config = {
      host = "localhost"
    }
  }
}

runner = {
  image = ${?ODIN_RUNNER_IMAGE}
  imagePullPolicy = "IfNotPresent"
  env = {
    AWS_ACCESS_KEY_ID = "accesskey"
    AWS_SECRET_ACCESS_KEY = "secretkey"
  }
  hostVolumeMounts = [
    {
      name = "test-host"
      hostPath = "/tmp"
      mountPath = "/host/tmp"
    }
  ]
  dockerSecrets = [
    {
      name = "test"
      server = "test-registry.io"
      username = "test"
      password = "test"
    }
  ]
}

discovery = {
  url = "http://localhost:8081"
}
